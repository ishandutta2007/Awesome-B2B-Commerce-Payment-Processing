<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Animated Glow Filter -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .pulse-orb {
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .float-item-1 {
      animation: floatUpDown1 5s ease-in-out infinite alternate;
    }
    .float-item-2 {
      animation: floatUpDown2 7s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flowDash 20s linear infinite;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.9); }
      100% { opacity: 0.6; transform: scale(1.15); }
    }
    @keyframes floatUpDown1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatUpDown2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(14px); }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Background Animated Glowing Orbs (Depth Layer) -->
  <g class="pulse-orb" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="140" fill="#4f46e5" filter="url(#glow-blur)" />
  </g>
  <g class="pulse-orb" style="transform-origin: 1050px 320px; animation-delay: -3s;">
    <circle cx="1050" cy="320" r="160" fill="#0284c7" filter="url(#glow-blur)" />
  </g>
  <g class="pulse-orb" style="transform-origin: 650px 380px; animation-delay: -1.5s;">
    <circle cx="650" cy="380" r="120" fill="#0d9488" filter="url(#glow-blur)" />
  </g>

  <!-- Technical Grid Architecture Patterns -->
  <g>
    <line x1="60" y1="0" x2="60" y2="420" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="420" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="420" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />
    <line x1="1140" y1="0" x2="1140" y2="420" class="grid-line" />

    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
  </g>

  <!-- Flowing Dynamic Animated Circuit Line -->
  <path d="M 60 210 Q 300 280 600 210 T 1140 210" fill="none" stroke="url(#primary-glow)" stroke-width="2" class="flow-line" opacity="0.4" />

  <!-- Floating Dynamic Tech Card 1: Level 2 / 3 Optimization -->
  <g class="float-item-1" transform="translate(930, 45)">
    <rect width="210" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#047857" opacity="0.3" />
    <circle cx="28" cy="37" r="6" fill="#10b981" />
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Level 2/3 Interchange</text>
    <text x="52" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#34d399">Fee Reduction Optimized</text>
  </g>

  <!-- Floating Dynamic Tech Card 2: Smart Orchestration -->
  <g class="float-item-2" transform="translate(930, 290)">
    <rect width="210" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="37" r="14" fill="#1d4ed8" opacity="0.3" />
    <circle cx="28" cy="37" r="6" fill="#38bdf8" />
    <text x="52" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Payment Orchestration</text>
    <text x="52" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#60a5fa">Multi-Acquirer Routing</text>
  </g>

  <!-- Floating Tech Pill (Left subtle background) -->
  <g class="float-item-2" transform="translate(70, 45)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="34" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Curated Fintech Stack</text>
  </g>

  <!-- FOREGROUND BRANDING / TITLE (Always in crisp foreground) -->
  <g transform="translate(70, 150)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="15" y="19" class="badge-text" fill="#a5b4fc">ENTERPRISE B2B COMMERCE &amp; FINTECH</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">
      Awesome <tspan fill="url(#primary-glow)">B2B Commerce</tspan> &amp; Payments
    </text>

    <!-- Subtitle & Key Features -->
    <text x="0" y="118" class="subtitle-text">
      Curated B2B Payment Gateways, Level 2/3 Interchange Automation &amp; Orchestration
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Net Terms / PO</text>

      <rect x="145" y="0" width="175" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">💳 Level 2/3 Card Data</text>

      <rect x="330" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔄 Smart Orchestration</text>

      <rect x="505" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌐 Composable APIs</text>
    </g>
  </g>
</svg>
